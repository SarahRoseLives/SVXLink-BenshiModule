# svxlink-benshi configuration
#
# This daemon exposes a Benshi-compatible radio (Vero VR-N76 / VR-N7600 and
# similar) to SvxLink through SvxLink's native NetTrx/RemoteTrx protocol.
# No ALSA loopback device and no SvxLink patch is required.
#
# Set RADIO/MAC to the Bluetooth address of the radio's *control* (SPP)
# service. Pair the radio first with bluetoothctl and trust it:
#
#   bluetoothctl
#   scan on
#   pair AA:BB:CC:DD:EE:FF
#   trust AA:BB:CC:DD:EE:FF
#   scan off
#   quit

[RADIO]
MAC=AA:BB:CC:DD:EE:FF
# Optional local HCI adapter address, usually left empty.
ADAPTER=
# Optional manual RFCOMM channel overrides. Leave 0 to discover them using
# SDP. Set these only if SDP discovery picks the wrong service.
CONTROL_CHANNEL=0
AUDIO_CHANNEL=0
# 0 = single channel, A/1 = dual watch VFO A, B/2 = dual watch VFO B.
# Leave empty/commented to keep the radio's current mode.
# DUAL_WATCH=0
# 0-based memory channel. Leave commented to keep the current channel.
# CHANNEL=30
# Simplex VFO frequency in MHz. Leave commented to keep the current channel.
# FREQUENCY=145.100
RX_CTCSS=0
TX_CTCSS=0
# Disable APRS location sharing on startup (recommended for a fixed node).
# APRS=0
STATUS_POLL_MS=500
CONNECT_RETRY_MS=5000
TX_LEAD_MS=100
SBC_BITPOOL=18

[SVXLINK]
# SvxLink should connect to this address. Keep BIND on loopback unless
# SvxLink runs on another host. Always set AUTH_KEY if BIND is not loopback.
BIND=127.0.0.1
PORT=5210
AUTH_KEY=
# Must match SvxLink's compile-time INTERNAL_SAMPLE_RATE. Current SvxLink
# defaults to 16000; older builds and some distributions use 8000.
SAMPLE_RATE=16000

[BRIDGE]
# radio | vox | auto. "auto" uses the radio's squelch and VOX together.
SQUELCH_MODE=auto
VOX_THRESHOLD_DB=-38
VOX_HANG_MS=600
RX_GAIN_DB=0
TX_GAIN_DB=0

[LOG]
LEVEL=info
# FILE=/var/log/svxlink-benshi.log
FILE=
